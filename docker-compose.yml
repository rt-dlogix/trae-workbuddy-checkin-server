services:
  checkin:
    build: .
    image: checkin-server:latest
    container_name: checkin-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      # 可选：设了简报台/账户页需密码登录；不设则无鉴权（仅内网使用）
      # - WEB_PASSWORD=your-password
      # 可选：覆盖监听（默认 0.0.0.0:8080）
      # - SERVE_HOST=0.0.0.0
      # - SERVE_PORT=8080
    volumes:
      # 数据目录：config.yaml / history.json / 日志，含凭据，勿公开
      - ./data:/app/data
